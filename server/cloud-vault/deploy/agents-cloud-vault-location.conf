# Include this location inside the TLS server block for agents.example.com.
# Cloudflare terminates the public HTTPS connection; Nginx keeps the service
# private on localhost and strips this prefix before proxying.
location ^~ /cloud-vault/ {
    client_max_body_size 120m;
    proxy_pass http://127.0.0.1:3010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    add_header Cache-Control "no-store" always;
}
