# Ретранслятор доставки на своём сервере (ntfy).
#
# Это образец: значения совпадают с рабочей выкладкой, кроме base-url —
# подставьте свой адрес. 203.0.113.10 — из диапазона, зарезервированного за
# документацией (TEST-NET-3), рабочим он быть не может.
#
# Ставится за nginx, поэтому слушает только петлевой адрес, а публичный вход —
# location /relay/ в конфигурации сайта. base-url должен совпадать с этим
# публичным адресом вместе с путём: ntfy подставляет его в ссылки на вложения.
base-url: "https://relay.example.com/relay"
listen-http: "127.0.0.1:2586"
# Клиент за адресом прокси, а не 127.0.0.1: иначе все посетители считаются
# одним и упираются в общий предел частоты.
behind-proxy: true

cache-file: /var/lib/ntfy/cache.db
# 30 суток. Столько же живёт непрочитанное сообщение: человек, открывший
# приложение через месяц, должен получить всё, что ему писали. Значение
# читается как длительность Go — «30d» ntfy не понимает и отвечает 400.
cache-duration: "720h"

attachment-cache-dir: /var/lib/ntfy/attachments
# Вложения живут меньше сообщений намеренно: место на диске стоит дороже, а
# само вложение всё равно продублировано в облачном хранилище, откуда клиент
# его достанет, если по ссылке ретранслятора уже пусто.
attachment-expiry-duration: 168h
attachment-file-size-limit: 20M
attachment-total-size-limit: 1500M

visitor-request-limit-burst: 1000
visitor-request-limit-replenish: 100ms
visitor-message-daily-limit: 100000
visitor-attachment-total-size-limit: 1G
visitor-attachment-daily-bandwidth-limit: 5G
keepalive-interval: 45s
