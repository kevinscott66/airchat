# Deploy from this directory with: flyctl deploy --remote-only
app = "airchat-signaling-example"
primary_region = "ams"

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Том под базу push-токенов. Токен присылают один раз при запуске приложения,
# а нужен он, когда приложение закрыто, — значит пережить деплой он обязан.
#
# Машина здесь ровно одна (min_machines_running = 1, auto_stop_machines = false),
# и это условие, а не совпадение: том привязан к машине, поэтому на двух
# машинах у каждой был бы свой кусок реестра и половина уведомлений уходила бы
# в пустоту. Масштабировать этот сервис вширь можно только вместе с переносом
# реестра в общее хранилище.
[[mounts]]
  source = "airchat_push"
  destination = "/data"

[env]
  NODE_ENV = "production"
  PUSH_TOKEN_DB = "/data/push-tokens.db"
