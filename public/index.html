<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>AirChat</title>

    <!--
      v4.32.560: без этих четырёх строк веб-версию нельзя поставить на
      домашний экран, а на iPhone это единственный способ получать
      уведомления при закрытой вкладке: Safari даёт Push API только
      установленной как приложение странице. Экспорт Expo своего манифеста
      не собирает, поэтому шаблон страницы — наш (см. public/sw.js).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AirChat" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Сброс стилей react-native-web: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!--
      v4.32.606: восстановление адреса ссылки. GitHub Pages отдаёт на /l/…
      страницу 404.html, и та приводит человека сюда с адресом в запросе.
      Здесь он возвращается в строку браузера настоящим путём — приложение
      читает его через Linking.getInitialURL() и открывает нужный экран.

      Проверка строгая нарочно: replaceState меняет только адрес, но чужая
      строка в адресной строке — это чужая строка в адресной строке.
      Принимается ровно один вид пути и ничего больше.
    -->
    <script>
      (function () {
        try {
          var m = /[?&]l=([^&]*)/.exec(window.location.search || '');
          if (!m) return;
          var rest = decodeURIComponent(m[1]);
          if (!/^[A-Za-z0-9._~:@+%-]+(\/[A-Za-z0-9._~:@+%-]+)*$/.test(rest)) return;
          if (rest.length > 4096) return;
          window.history.replaceState(null, '', '/l/' + rest);
        } catch (e) {
          /* адрес останется прежним — приложение просто откроется на своём экране */
        }
      })();
    </script>
    <noscript>Для работы AirChat нужен JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
