name: Commit attribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: kevinscott66 only
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit attribution
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [[ -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            base="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" || true)"
            if [[ -n "$base" ]]; then
              range="$base..$HEAD_SHA"
            elif git rev-parse "$HEAD_SHA^" >/dev/null 2>&1; then
              range="$HEAD_SHA^..$HEAD_SHA"
            else
              range="$HEAD_SHA"
            fi
          fi

          failed=0
          while IFS= read -r commit; do
            author="$(git show -s --format='%an' "$commit")"
            subject="$(git show -s --format='%s' "$commit")"

            if [[ "$author" != "kevinscott66" ]]; then
              printf 'ERROR: %s has author %q; expected kevinscott66 (%s)\n' \
                "$commit" "$author" "$subject" >&2
              failed=1
            fi

            if git show -s --format='%B' "$commit" | grep -Eiq '^Co-authored-by:'; then
              printf 'ERROR: %s contains a Co-authored-by trailer (%s)\n' \
                "$commit" "$subject" >&2
              failed=1
            fi
          done < <(git rev-list "$range")

          exit "$failed"
