name: CI

# Обязательные проверки качества (AC-06). До v4.32.721 в CI были только
# attribution и secret scanning: TypeScript, lint, 8500+ клиентских и ~150
# серверных тестов запускались только руками, а сборка — никогда.
# Статусы этих jobs включены как required в защите ветки main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: package.json commands resolve their files
        run: npm run check:scripts
      - run: npm run typecheck
      - run: npm run lint
      - name: Jest
        run: npx jest --ci --maxWorkers=2

  servers:
    name: Servers (signaling, cloud-vault)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dir: [signaling-server, server/cloud-vault]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: ${{ matrix.dir }}
      - run: npm test
        working-directory: ${{ matrix.dir }}

  web-build:
    name: Web smoke build + budget + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: expo export (web)
        run: npx expo export --platform web --output-dir dist
      - name: Load budget
        run: npm run web:budget
      - name: Web E2E (headless Chrome)
        run: npm run e2e:web
